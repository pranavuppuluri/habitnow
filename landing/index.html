<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14161d" />
    <title>unhuman.in</title>
    <meta name="description" content="Personal projects by Pranav." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%235B6CFF' stroke-width='5' stroke-dasharray='56 19' stroke-linecap='round' transform='rotate(-90 16 16)'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #14161d;
        --surface: #1c1f29;
        --surface-2: #242836;
        --line: #333848;
        --text: #eef0f6;
        --muted: #99a0b3;
        --habit: #5b6cff;
        --health: #ff7a59;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body {
        background: radial-gradient(1200px 700px at 50% -10%, #1b1f2e 0%, var(--bg) 60%);
        color: var(--text);
        font-family: "Instrument Sans", system-ui, sans-serif;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 32px 16px;
        -webkit-font-smoothing: antialiased;
      }
      .wrap { width: 100%; max-width: 460px; }
      .eyebrow { color: var(--muted); font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; margin: 0 0 8px; }
      h1 { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 34px; letter-spacing: -0.02em; margin: 0 0 28px; }
      .grid { display: grid; gap: 14px; }
      a.tile {
        display: flex; align-items: center; gap: 16px; text-decoration: none; color: var(--text);
        background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px;
        transition: border-color .15s, transform .06s, background .15s;
      }
      a.tile:hover { border-color: var(--accent); background: var(--surface-2); }
      a.tile:active { transform: translateY(1px); }
      .tile { --accent: var(--line); }
      .tile.habit { --accent: var(--habit); }
      .tile.health { --accent: var(--health); }
      .icon {
        width: 50px; height: 50px; border-radius: 13px; flex: none; display: grid; place-items: center;
        background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent);
      }
      .meta { flex: 1; min-width: 0; }
      .meta .name { font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 20px; letter-spacing: -0.01em; }
      .meta .desc { color: var(--muted); font-size: 14px; margin-top: 2px; }
      .chev { color: var(--muted); flex: none; }
      .foot { color: var(--muted); font-size: 12px; margin-top: 28px; text-align: center; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <p class="eyebrow">Personal projects</p>
      <h1>unhuman.in</h1>

      <div class="grid">
        <a class="tile habit" href="https://devpranav.tailnet-6fba.ts.net/">
          <span class="icon" aria-hidden="true">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9" stroke-dasharray="42 14" stroke-linecap="round" transform="rotate(-90 12 12)"/></svg>
          </span>
          <span class="meta">
            <div class="name">HabitNow</div>
            <div class="desc">Build habits one day at a time.</div>
          </span>
          <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 6l6 6-6 6"/></svg>
        </a>

        <a class="tile health" href="https://devpranav.tailnet-6fba.ts.net:8443/">
          <span class="icon" aria-hidden="true">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1L8 4h8l1.5 2h1A2.5 2.5 0 0 1 21 8.5v9A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5z"/><circle cx="12" cy="13" r="3.6"/></svg>
          </span>
          <span class="meta">
            <div class="name">HealthNow</div>
            <div class="desc">Photograph a dish, the model names it.</div>
          </span>
          <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 6l6 6-6 6"/></svg>
        </a>
      </div>

      <p class="foot">Served from a private box over Tailscale.</p>
    </div>
  </body>
</html>
